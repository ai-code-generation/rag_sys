services:
  custom-reranking:
    container_name: custom-reranking-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8000"  # Custom reranking service port
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional: Mount cache directory for model downloads
      - reranking-cache:/home/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
          # Uncomment below if you want to use GPU
          # devices:
          #   - driver: nvidia
          #     device_ids: ['${RANKING_MS_GPU_ID:-0}']
          #     capabilities: [gpu]
    restart: unless-stopped

volumes:
  reranking-cache:
    driver: local

networks:
  default:
    name: nvidia-rag
    external: true
