services:
  reranking:
    container_name: reranking-service
    image: reranking-service:${TAG:-latest}
    build:
      # Set context to reranking service directory (relative to this file's location)
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8000"  # Custom reranking service port
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      # Mount specific cache directory for model downloads
      - /static-data/team_08/.cache/rag:/home/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped

networks:
  default:
    name: nvidia-rag
